# Monolito + novo microsservico de Pagamento lado a lado (Strangler Fig).
#   docker compose up --build
# Troque o modo da migracao sem mexer no codigo:
#   $env:PAGAMENTO_MODO="SOMBRA";        docker compose up -d   (legado decide, novo compara)
#   $env:PAGAMENTO_MODO="MICROSSERVICO"; docker compose up -d   (novo decide)
#   $env:PAGAMENTO_MODO="LEGADO";        docker compose up -d   (rollback)

name: ecommerce-migracao

services:

  monolito:
    build: ./monolito
    image: ecommerce/monolito:1.0
    ports:
      - "${PORTA_MONOLITO:-28080}:8080"
    environment:
      PAGAMENTO_MODO: ${PAGAMENTO_MODO:-SOMBRA}
      PAGAMENTO_SERVICE_URL: http://pagamento-service:8081
    depends_on:
      pagamento-service:
        condition: service_healthy
    networks: [ecommerce-net]

  pagamento-service:
    build: ./pagamento-service
    image: ecommerce/pagamento-service:1.0
    ports:
      - "${PORTA_PAGAMENTO:-28081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || bash -c '</dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    networks: [ecommerce-net]

networks:
  ecommerce-net:
    driver: bridge
