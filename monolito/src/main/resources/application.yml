spring:
  application:
    name: ecommerce-legado-ddd

  datasource:
    url: jdbc:h2:mem:ecommerce;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080


migracao:
  pagamento:
    modo: ${PAGAMENTO_MODO:LEGADO}           
    url: ${PAGAMENTO_SERVICE_URL:http://localhost:8081}
    timeout-ms: 3000

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
