spring:
  application:
    name: pagamento-service
  datasource:
    # Banco separado do monolito: o contexto de Pagamento e dono dos seus dados
    url: jdbc:h2:mem:pagamentos;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health

pagamento:
  # Regras de negocio do dominio (antes "escondidas" no ProcessadorPagamento do monolito)
  limite-por-transacao: 10000.00
